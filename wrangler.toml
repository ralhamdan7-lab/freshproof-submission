name = "freshproof-submission-demo"
main = "worker/index.js"
compatibility_date = "2026-11-09"
workers_dev = true
preview_urls = false

[[ratelimits]]
name = "API_RATE_LIMITER"
namespace_id = "20261115"
simple = { limit = 15, period = 60 }

[vars]
ALLOWED_ORIGIN = "https://freshproof-submission-demo.ralhamdan7.workers.dev"
ENABLE_SEMANTIC_TRIAGE = "true"
ENABLE_CORRECTION_CANDIDATE_REVIEW = "true"
PLANNED_AUTHORITY_MODE = "on"
REPLACEMENT_VALUE_MODE = "header"
NORMATIVE_SPEC_MODE = "header"
ISSUER_AUTHORITY_MODE = "header"
# Optional free-tier Groq fallback. Active only when the GROQ_API_KEY secret is set.
GROQ_FALLBACK_ENABLED = "true"
SEMANTIC_PRIMARY = "groq"
GROQ_MODELS = "qwen/qwen3.8-27b,openai/gpt-oss-120b,openai/gpt-oss-20b"
GROQ_FAST_MODELS = "qwen/qwen3.8-27b,openai/gpt-oss-120b"
GROQ_120B_RPM = "30"
GROQ_120B_TPM = "8000"
GROQ_20B_RPM = "30"
GROQ_20B_TPM = "8000"
GROQ_QWEN_RPM = "30"
GROQ_QWEN_TPM = "8000"

[ai]
binding = "AI"

[assets]
directory = "./src"
binding = "ASSETS"
