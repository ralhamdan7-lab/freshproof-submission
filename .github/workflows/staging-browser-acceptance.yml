name: FreshProof Public Demo Browser Acceptance

on:
  push:
    branches: [main, release/public-0.2.76-sanitized]
    paths:
      - 'src/**'
      - 'worker/**'
      - 'wrangler.toml'
      - 'scripts/staging-browser-smoke.mjs'
      - '.github/workflows/staging-browser-acceptance.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'worker/**'
      - 'wrangler.toml'
      - 'scripts/staging-browser-smoke.mjs'
      - '.github/workflows/staging-browser-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Install Playwright
        run: npm install --no-save --no-package-lock playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Serve isolated static UI for deterministic browser test
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8787 --bind 127.0.0.1 --directory src > /tmp/freshproof-http.log 2>&1 &
          echo $! > /tmp/freshproof-http.pid
          for attempt in $(seq 1 15); do
            if curl --fail --silent http://127.0.0.1:8787/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/freshproof-http.log
          exit 1
      - name: Test isolated Worker UI with deterministic API fixture
        env:
          FRESH_PROOF_BASE_URL: http://127.0.0.1:8787
        run: node scripts/staging-browser-smoke.mjs
      - name: Wait for exact public Worker release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          FRESH_PROOF_PUBLIC_URL: https://freshproof-submission-demo.ralhamdan7.workers.dev
        shell: bash
        run: |
          expected="$(node -p "require('./package.json').version")"
          for attempt in $(seq 1 36); do
            body="$(curl --silent --show-error --max-time 8 "$FRESH_PROOF_PUBLIC_URL/api/health" || true)"
            actual="$(printf '%s' "$body" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{process.stdout.write(JSON.parse(s).version||'')}catch{}})")"
            if [[ "$actual" == "$expected" ]]; then
              echo "Public Worker health verified: $actual"
              exit 0
            fi
            echo "Waiting for version $expected (observed: ${actual:-unavailable}), attempt $attempt/36"
            sleep 5
          done
          echo "Expected public Worker version $expected was not observed."
          exit 1
      - name: Test deployed public UI and live verification flow
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          FRESH_PROOF_PUBLIC_URL: https://freshproof-submission-demo.ralhamdan7.workers.dev
          EXPECTED_VERSION: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main' || 'skip' }}
        shell: bash
        run: |
          EXPECTED_VERSION="$(node -p "require('./package.json').version")" node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const base = process.env.FRESH_PROOF_PUBLIC_URL;
          const expected = process.env.EXPECTED_VERSION;
          const browser = await chromium.launch({ headless: true });
          try {
            const page = await browser.newPage();
            const pageErrors = [];
            page.on('pageerror', error => pageErrors.push(error.message));
            const response = await page.goto(base, { waitUntil: 'networkidle', timeout: 30000 });
            if (!response?.ok()) throw new Error(`Public UI returned HTTP ${response?.status()}`);
            if (!(await page.title()).includes('FreshProof')) throw new Error('Unexpected public page title');
            if (!(await page.locator('#answer').isVisible())) throw new Error('Claim input is not visible');
            if (!(await page.locator('#verify').isVisible())) throw new Error('Verify action is not visible');
            await page.locator('#answer').fill('Node.js 20.x remains actively supported under LTS.');
            await page.locator('#verify').click();
            await page.waitForFunction(() => {
              const results = document.querySelector('#results');
              const status = document.querySelector('#claim-list .claim .status');
              return results && !results.hidden && status && status.textContent.includes('OUTDATED');
            }, null, { timeout: 60000 });
            const card = page.locator('#claim-list .claim');
            const status = await card.locator('.status').innerText();
            const links = await card.locator('.evidence a').evaluateAll(items => items.map(item => item.href));
            const officialNodeLinks = links.filter(url => {
              try { return new URL(url).hostname === 'nodejs.org'; } catch { return false; }
            });
            if (!officialNodeLinks.length) throw new Error('No official Node.js evidence link was rendered');
            if (pageErrors.length) throw new Error(`Browser runtime errors: ${pageErrors.join('; ')}`);
            console.log(JSON.stringify({
              browser_acceptance: 'PASS',
              version: expected,
              page_title: await page.title(),
              verification_status: status,
              evidence_links: links.length,
              official_nodejs_links: officialNodeLinks.length,
              browser_runtime_errors: pageErrors.length
            }, null, 2));
          } finally {
            await browser.close();
          }
          NODE
