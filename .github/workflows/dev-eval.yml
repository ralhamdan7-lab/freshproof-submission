name: FreshProof development diagnostic (public demo)

# Runs a small, explicitly listed set of development cases against the public
# demo. Labels are assistant-authored, so results are diagnostics, not accuracy.
# The trigger file names the cases and an optional experiment header, e.g.
#   run 1 cases=D02,D29 experiment=planned-authority
on:
  push:
    branches: [main]
    paths: ['triggers/dev-eval.txt']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: freshproof-dev-eval
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Read scope
        id: scope
        run: |
          cases=$(grep -o 'cases=[A-Z0-9,]*' triggers/dev-eval.txt | cut -d= -f2 || true)
          experiment=$(grep -o 'experiment=[a-z-]*' triggers/dev-eval.txt | cut -d= -f2 || true)
          if [ -z "$cases" ]; then echo "No cases listed; nothing to run."; fi
          echo "cases=$cases" >> "$GITHUB_OUTPUT"
          echo "experiment=$experiment" >> "$GITHUB_OUTPUT"
      - name: Wait for the deployed version
        if: steps.scope.outputs.cases != ''
        run: |
          expected=$(node -p "require('./package.json').version")
          for i in $(seq 1 30); do
            v=$(curl -s --max-time 20 https://freshproof-submission-demo.ralhamdan7.workers.dev/api/health | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).version)}catch{console.log('')}})")
            [ "$v" = "$expected" ] && echo "deployed $v" && exit 0
            sleep 20
          done
          echo "deployed version did not reach $expected"; exit 1
      - name: Run diagnostic
        if: steps.scope.outputs.cases != ''
        env:
          FRESH_PROOF_BASE_URL: https://freshproof-submission-demo.ralhamdan7.workers.dev
          DEV_CASES: ${{ steps.scope.outputs.cases }}
          FRESH_PROOF_EXPERIMENT: ${{ steps.scope.outputs.experiment }}
        run: node scripts/dev-diverse-eval.mjs
