name: FreshProof verification tests

on:
  push:
    branches:
      - main
      - feat/general-temporal-retrieval
      - fix/nodejs-ongoing-lts-support
  pull_request:
    branches:
      - feat/general-temporal-retrieval
      - main
  workflow_dispatch:

concurrency:
  group: freshproof-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Run Node tests
        run: node --test
      - name: Check Worker syntax
        run: node --check worker/index.js
      - name: Check adjudication module syntax
        run: node --check worker/evidence-adjudication.js
      - name: Check domain adapter syntax
        run: node --check worker/domain-adapters.js
      - name: Check browser application syntax
        run: node --check src/app.js
      - name: Run temporal smoke benchmark
        run: node benchmarks/run-temporal-benchmark.js
