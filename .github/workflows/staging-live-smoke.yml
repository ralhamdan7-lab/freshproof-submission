name: FreshProof Public Demo Health Acceptance

# This workflow checks only the isolated public demo health endpoint.
# It deliberately makes no evidence-search requests and consumes no Tavily/Workers AI quota.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-demo-health:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Check public demo health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 \
            'https://freshproof-submission-demo.ralhamdan7.workers.dev/api/health' \
            --output /tmp/freshproof-health.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const body = JSON.parse(fs.readFileSync('/tmp/freshproof-health.json', 'utf8'));
          if (body.ok !== true || body.service !== 'FreshProof' || body.version !== '0.2.76') {
            throw new Error('Public demo health/version contract mismatch: ' + JSON.stringify(body));
          }
          console.log(JSON.stringify(body, null, 2));
          NODE
